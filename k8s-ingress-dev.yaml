# HTTPS entry for the dev checkout through k3s Traefik, pointing at the Docker container
# published on the host at 192.168.50.10:5081 - same pattern as k8s-ingress.yaml (prod),
# plus a LAN-only Traefik middleware (same idea as portfolio-dev's portfolio-lan-only).
# Apply (no sudo):  ./apply-ingress-dev.sh
apiVersion: v1
kind: Namespace
metadata:
  name: room-planner-dev
---
apiVersion: v1
kind: Service
metadata:
  name: room-planner-dev
  namespace: room-planner-dev
spec:
  ports:
    - name: http
      port: 5081
      targetPort: 5081
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: room-planner-dev-host
  namespace: room-planner-dev
  labels:
    kubernetes.io/service-name: room-planner-dev
addressType: IPv4
ports:
  - name: http
    port: 5081
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.50.10
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: room-planner-dev
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: room-planner-dev-tls
  namespace: room-planner-dev
spec:
  secretName: room-planner-dev-tls
  dnsNames:
    - dev-room.kienhomeserver.lab
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: room-planner-lan-only
  namespace: room-planner-dev
spec:
  ipAllowList:
    sourceRange:
      - 192.168.50.0/24
      - 100.64.0.0/10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: room-planner-dev
  namespace: room-planner-dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: room-planner-dev-room-planner-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dev-room.kienhomeserver.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: room-planner-dev
                port:
                  number: 5081
  tls:
    - hosts:
        - dev-room.kienhomeserver.lab
      secretName: room-planner-dev-tls
