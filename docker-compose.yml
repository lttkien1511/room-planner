# Room Planner: nginx (static web + /api proxy) + a tiny Python API that stores projects.
#   up:    ./deploy.sh
#   data:  DATA_DIR in .env  (./data locally, /mnt/omv/room-planner once the OMV share is mounted)

services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5080}:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  api:
    image: python:3.12-alpine
    restart: unless-stopped
    # Files written to an all_squash NFS export end up owned by the export's anonuid anyway.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["python", "-u", "/app/server.py", "--data", "/data", "--port", "8000", "--host", "0.0.0.0"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./api:/app:ro
      - ${DATA_DIR:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
