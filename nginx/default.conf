# Room Planner: static files + reverse proxy for /api -> the storage container.
# NOTE: any `add_header` inside a location DROPS every add_header inherited from outer levels,
# so security-headers.inc is included in every location that serves content.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 7m;   # API accepts up to 6 MB documents

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;

        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's DNS: survives the api container getting a new IP
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;         # keep the port: the API compares Origin with Host
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;   # revalidate (ETag) on every load: no hashed filenames
        try_files $uri $uri/ =404;
    }
}
